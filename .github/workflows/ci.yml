# Intégration et livraison continues du frontend.
#
# Trois temps : on vérifie, on analyse, on publie. Rien n'est publié qui n'ait passé les deux
# premiers — `needs` l'impose, et la publication ne se déclenche que sur les références qui
# désignent quelque chose de déployable.

name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un push qui en remplace un autre sur la même référence annule le précédent : inutile de
# faire tourner un pipeline pour un commit que personne ne déploiera. Une exception pour les
# tags, dont l'annulation laisserait une version sans image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || 'mcjordan12' }}/gestion-stock-frontend

jobs:
  # ── Qualité ────────────────────────────────────────────────────────────────────────────
  qualite:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud a besoin de l'historique complet pour attribuer les lignes neuves à
          # leur commit ; une copie superficielle lui ferait voir tout le dépôt comme neuf.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run lint:styles

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Tests et couverture
        run: npm run test:coverage

      - name: Build de production
        run: npm run build

      - name: Couverture pour l'analyse
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage/frontend-angular/lcov.info
          retention-days: 5

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Frontend"
            echo
            echo "| Étape | État |"
            echo "|---|---|"
            echo "| Lint, types, format | ${{ job.status == 'success' && 'OK' || 'échec' }} |"
            if [ -d dist/frontend-angular/browser ]; then
              echo "| Poids du bundle | $(du -sh dist/frontend-angular/browser | cut -f1) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Analyse statique ───────────────────────────────────────────────────────────────────
  # Séparée de la qualité pour que l'absence de jeton SonarCloud — sur un fork, par exemple —
  # ne fasse pas tomber tout le pipeline.
  sonar:
    name: SonarCloud
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: couverture
          path: coverage/frontend-angular

      - name: Analyse
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Dépendances ────────────────────────────────────────────────────────────────────────
  dependances:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Le seuil est `high` : signaler chaque avis `low` d'un paquet de développement ferait
      # rougir le pipeline en permanence, et un pipeline toujours rouge n'est plus lu.
      - name: npm audit
        run: npm audit --audit-level=high

  # ── Image ──────────────────────────────────────────────────────────────────────────────
  image:
    name: Image Docker
    needs: [qualite, dependances]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Une pull request construit l'image pour vérifier que le Dockerfile tient, mais ne la
    # publie pas : rien de non fusionné n'a sa place dans un registre public.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=gestion-stock-frontend
            org.opencontainers.image.description=Interface Angular de gestion-stock, servie par nginx

      - name: Connexion à Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE || 'mcjordan12' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # L'image est d'abord construite pour la seule architecture de l'exécuteur et chargée
      # localement : c'est celle que Trivy inspecte. Le build multi-architecture ne part
      # qu'ensuite, une fois le scan passé.
      - name: Construction pour analyse
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: analyse:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: analyse:local
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Remontée dans l'onglet sécurité
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Échec sur vulnérabilité corrigeable
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: analyse:local
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Construction multi-architecture et publication
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Image frontend"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
