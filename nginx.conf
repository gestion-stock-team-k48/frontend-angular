# Service du SPA et relais de l'API, dans le même hôte.
#
# `apiBaseUrl` vaut `/api/v1`, un chemin relatif : l'application appelle son API sur sa
# propre origine. C'est ce qui évite toute configuration au démarrage du conteneur — une
# seule image sert n'importe quel environnement — et toute question de CORS.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Le nom du service backend est injecté au démarrage : le compose le résout, un
    # orchestrateur y met le sien.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Relais de l'API ──────────────────────────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/snippets/securite.conf;

        # Spring Security pose déjà `X-Frame-Options` et `X-Content-Type-Options` : sans
        # cette ligne, la réponse en porte deux exemplaires. Ce n'est pas dangereux, mais
        # deux valeurs pour un même en-tête sont deux occasions de diverger — c'est nginx,
        # au bord, qui tranche.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;

        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Un téléversement de photo peut atteindre la limite du backend (10 Mo) ; nginx doit
        # laisser passer autant, sinon il refuse avant que l'application ne voie la requête.
        client_max_body_size 12m;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Empreintes de build : immuables, donc cachées pour de bon ─────────────────────────
    # `outputHashing: all` met une empreinte dans chaque nom de fichier : un contenu qui
    # change change de nom, le cache n'a donc jamais à être invalidé.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        include    /etc/nginx/snippets/securite.conf;
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    # ── L'index n'est jamais caché ───────────────────────────────────────────────────────
    # Il porte les références aux fichiers empreints : le cacher figerait l'application sur
    # une version passée.
    location = /index.html {
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # ── Routage côté client ──────────────────────────────────────────────────────────────
    # Une URL profonde tapée à la main, ou rechargée, doit rendre l'index : c'est le routeur
    # Angular qui décide ensuite quoi afficher.
    location / {
        include /etc/nginx/snippets/securite.conf;
        try_files $uri $uri/ /index.html;
    }

    # ── Sonde ────────────────────────────────────────────────────────────────────────────
    location = /sante {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Compression ──────────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml
                      font/woff font/woff2;

    server_tokens off;
}
