# Analyse SonarCloud du frontend.
#
# La version et le nom du projet ne sont pas répétés ici : l'action de la CI les passe en
# ligne de commande depuis le contexte GitHub, ce qui évite un fichier à maintenir en double.

sonar.projectKey=gestion-stock-team-k48_frontend-angular
sonar.organization=gestion-stock-team-k48

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
sonar.exclusions=src/**/*.spec.ts,src/test-setup.ts,src/app/core/api/generated/**

# `api.ts` est produit par openapi-typescript à partir du contrat du backend : le corriger
# n'aurait aucun sens, il serait écrasé à la prochaine synchronisation.
sonar.coverage.exclusions=src/main.ts,src/environments/**,src/app/core/api/generated/**,src/**/*.spec.ts

sonar.javascript.lcov.reportPaths=coverage/frontend-angular/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# ── Règles écartées ───────────────────────────────────────────────────────────────────────
# `Web:InputWithoutLabelCheck` lit les gabarits comme des pages statiques. Il ne peut pas
# savoir qu'`<app-champ>` rend un `<label for>` autour du contrôle qu'on lui projette, et
# signalait donc les 71 champs de l'application — tous correctement étiquetés, vérifié un
# par un.
#
# La règle n'est pas abandonnée, elle est remplacée : `shared/ui/champ/etiquetage.spec.ts`
# pose la même question en connaissant les conventions du projet, et échoue avec le fichier
# et la ligne du contrôle fautif. Ce test a été vu échouer avant d'être retenu.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.html

# `typescript:S7718` veut que le paramètre d'un `catch` s'appelle `error_`. Le vocabulaire de
# ce projet est français (voir `02-CONVENTIONS.md`) : `erreur` est le nom employé partout,
# des services aux gabarits. Renommer quatorze `catch` pour satisfaire une convention
# anglophone rendrait le code incohérent avec lui-même, ce qui est exactement le défaut que
# la règle prétend éviter.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S7718
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts

# `Web:S6819` demande l'élément natif plutôt que le rôle ARIA. Les huit cas signalés sont
# délibérés et le changement dégraderait le sens :
#
#   - `<p role="status">` porte des avertissements et des confirmations. `<output>` a bien
#     `role=status` implicite, mais il désigne « le résultat d'un calcul » dans un
#     formulaire. Un message d'avertissement n'en est pas un, et l'élément est en outre
#     `display: inline`, ce qui casserait des encadrés qui reposent sur le flux de bloc.
#   - `role="img"` sur un `<svg>` et sur la barre de répartition n'est pas redondant : c'est
#     la pratique établie pour que les lecteurs d'écran annoncent le graphique comme une
#     image nommée au lieu d'énumérer ses formes.
#
# L'accessibilité rendue est identique dans les deux cas ; seule la préférence de la règle
# diffère.
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.html

sonar.sourceEncoding=UTF-8
