# En-têtes de sécurité, inclus par chaque bloc `location`.
#
# La répétition est voulue, pas une maladresse : dans nginx, un `add_header` posé dans un
# bloc annule tous ceux des blocs parents. Déclarés une seule fois au niveau du serveur, ces
# en-têtes disparaîtraient dès qu'une location pose son propre `Cache-Control` — ce que font
# ici l'index et les fichiers empreints.
#
# Pas de `Content-Security-Policy` : Angular n'a besoin d'aucune exception, mais la politique
# dépend du domaine et de ce qui est servi à côté. Elle se pose sur le reverse proxy public,
# avec le TLS.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "DENY"    always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
