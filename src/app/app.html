<!--
  Page d'attente de la phase 2. Elle n'a qu'un rôle : rendre le thème visible et
  vérifiable à la main tant que le shell applicatif n'existe pas. Elle disparaît en
  phase 4, remplacée par la topbar, la sidebar et la zone de contenu.
-->
<main class="attente">
  <h1>Gestion de Stock</h1>
  <p class="attente__sous-titre">
    Thème {{ theme.themeApplique() }} · densité {{ theme.densite() }} · rayon
    {{ theme.rayon() }}
  </p>

  <section class="attente__surfaces" aria-label="Surfaces">
    @for (surface of surfaces; track surface) {
      <div class="attente__surface" [style.background]="'var(--surface-' + surface + ')'">
        surface-{{ surface }}
      </div>
    }
  </section>

  <section class="attente__marque" aria-label="Couleur de marque">
    <button type="button" class="attente__bouton">Valider la commande</button>
    <span class="attente__code" data-numerique>ART-00187</span>
    <span class="attente__code" data-numerique>1 250 000 FCFA</span>
  </section>

  <section class="attente__etats" aria-label="Couleurs de la jauge de seuil">
    <span class="attente__pastille attente__pastille--ok">Stock correct</span>
    <span class="attente__pastille attente__pastille--low">Sous le seuil</span>
    <span class="attente__pastille attente__pastille--out">Rupture</span>
  </section>

  <section class="attente__reglages" aria-label="Réglages d'apparence">
    <button type="button" class="attente__lien" (click)="theme.definirMode('clair')">Clair</button>
    <button type="button" class="attente__lien" (click)="theme.definirMode('sombre')">
      Sombre
    </button>
    <button type="button" class="attente__lien" (click)="theme.definirMode('systeme')">
      Système
    </button>
    <button type="button" class="attente__lien" (click)="basculerDensite()">
      Densité : {{ theme.densite() }}
    </button>
    @for (preset of presets; track preset.nom) {
      <button type="button" class="attente__lien" (click)="theme.definirAmorce(preset.couleur)">
        {{ preset.nom }}
      </button>
    }
  </section>

  <router-outlet />
</main>
