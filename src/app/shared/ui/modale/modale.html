<dialog #dialogue class="modale" [attr.aria-label]="titre()" (cancel)="demanderFermeture($event)">
  <div class="modale__panneau">
    <header class="modale__entete">
      <h2 class="modale__titre">{{ titre() }}</h2>
      @if (!bloquante()) {
        <button type="button" class="modale__fermer" aria-label="Fermer" (click)="fermeture.emit()">
          <span aria-hidden="true">×</span>
        </button>
      }
    </header>

    <div class="modale__corps">
      <ng-content />
    </div>

    <footer class="modale__pied">
      <ng-content select="[modale-actions]" />
    </footer>
  </div>
</dialog>
